name: CodeQL Analysis

# The sole CodeQL setup: keep GitHub default setup unconfigured.
# Scan code, dependencies and workflows, plus a weekly catch-up.
on:
  push:
    branches: [main, master]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "**.vue"
      - "**.py"
      - "**.pyi"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "**/action.yml"
      - "**/action.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "**.vue"
      - "**.py"
      - "**.pyi"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "**/action.yml"
      - "**/action.yaml"
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 3" # Weekly Wed 10 PM SGT (off Monday spike)

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Public repository scans use standard runners; skip before runner allocation
    # if repository visibility changes and paid code scanning is unavailable.
    if: github.event.repository.private == false
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All three are present: workflows, the React app/API and Python fixtures.
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}
