name: Build Check

# Validate the actual app and synthetic providers on every PR and main update.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Node.js project
        id: detect
        run: |
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
            # Detect package manager
            if [ -f "bun.lockb" ]; then
              echo "pm=bun" >> "$GITHUB_OUTPUT"
            elif [ -f "pnpm-lock.yaml" ]; then
              echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            else
              echo "pm=npm" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            echo "No build script found in package.json — skipping build check."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: ${{ steps.detect.outputs.pm }}

      - name: Install dependencies (npm)
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'npm'
        # Use --legacy-peer-deps as a last resort only — if install fails cleanly
        # first, that failure is intentional and should block the PR.
        run: npm ci

      - name: Install dependencies (pnpm)
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'pnpm'
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Install dependencies (bun)
        if: steps.detect.outputs.has_build == 'true' && steps.detect.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run build
        if: steps.detect.outputs.has_build == 'true'
        run: ${{ steps.detect.outputs.pm == 'npm' && 'npm run build' || format('{0} run build', steps.detect.outputs.pm) }}

      - name: Setup Python browser fixtures
        if: steps.detect.outputs.has_build == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install browser fixture runner
        if: steps.detect.outputs.has_build == 'true'
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Verify weather loading, cancellation, location and recovery
        if: steps.detect.outputs.has_build == 'true'
        run: python tests/weather.py

      - name: Verify focus timer sleep, pause and completion
        if: steps.detect.outputs.has_build == 'true'
        run: python tests/focus-timer.py --output focus-timer-results.json

      - name: Preserve weather browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weather-browser-evidence
          path: |
            weather-results/
            focus-timer-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Build succeeded
        if: steps.detect.outputs.has_build == 'true'
        run: echo "✅ Build passed — safe to merge."

      - name: No build script
        if: steps.detect.outputs.has_build == 'false'
        run: echo "ℹ️ No build script detected — skipping build check."
